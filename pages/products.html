<div class="wrap">
  <nav class="crumbs"><a href="index.html">首頁</a><span>/</span><span>今日漁獲</span></nav>
</div>

<section class="section" style="padding-top:12px">
  <div class="wrap">
    <div class="section-head" style="margin-bottom:34px">
      <span class="eyebrow">Today's Catch</span>
      <h2>今日漁獲</h2>
      <p class="lead" style="margin-top:14px">各地個人釣客今日上架的現流漁獲，共 <b id="total-count">7</b> 種，數量有限、售完為止。可依魚類與地區篩選，避免商品過遠無法運送。</p>
    </div>

    <!-- 地區選擇 -->
    <div class="region-bar">
      <span class="region-bar__label">我的地區</span>
      <div class="region-chips" id="region-chips"></div>
      <span class="region-bar__hint" id="region-hint">選擇地區後，將優先顯示可運送給你的漁獲</span>
    </div>

    <div class="layout" style="margin-top:44px">
      <!-- 篩選側欄 -->
      <aside class="filters">
        <h4>魚類</h4>
        <label class="check"><input type="checkbox" class="f-cat" value="fish" checked> 魚類</label>
        <label class="check"><input type="checkbox" class="f-cat" value="ceph" checked> 頭足類（小卷／軟絲）</label>

        <h4>地區</h4>
        <div id="f-regions"></div>

        <h4>價格區間</h4>
        <input type="range" class="range" min="150" max="2000" value="2000" id="price-range">
        <div style="display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin-top:8px;font-family:var(--font-mono)">
          <span>$150</span><span id="price-max">$2,000</span>
        </div>

        <h4>其他</h4>
        <label class="check"><input type="checkbox" id="f-instock"> 僅顯示尚有庫存</label>
        <label class="check"><input type="checkbox" id="f-sashimi"> 生食級</label>
        <label class="check"><input type="checkbox" id="f-selfpick"> 可買家自取</label>

        <button class="btn btn--ghost btn--sm btn--block" style="margin-top:28px" id="reset-filters">重設篩選</button>
      </aside>

      <!-- 漁獲區 -->
      <div>
        <div class="toolbar">
          <div class="toolbar__count">今日供應 <b id="shown-count">7</b> 種現流</div>
          <div style="display:flex;align-items:center;gap:12px">
            <span style="font-size:.74rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase">排序</span>
            <select class="select" id="sort" style="width:auto;padding:6px 26px 6px 2px;font-size:.84rem">
              <option value="fresh">捕獲時間（最新）</option>
              <option value="price-asc">價格：低 → 高</option>
              <option value="price-desc">價格：高 → 低</option>
              <option value="stock">剩餘數量（多 → 少）</option>
            </select>
          </div>
        </div>
        <div class="grid grid--3" id="catch-grid"></div>
      </div>
    </div>
  </div>
</section>
