<main class="wrap account-page">
  <nav class="crumbs"><a href="index.html">首頁</a><span aria-hidden="true">/</span><span>設定</span></nav>
  <div class="page-head">
    <span class="eyebrow">Settings</span>
    <h1>設定</h1>
    <p class="lead">編輯頭像、暱稱、電話與地址；儲存後立即更新導覽列。</p>
  </div>

  <form class="settings" id="settings-form" novalidate>
    <section class="settings__block">
      <h2>頭像</h2>
      <div class="settings__avatar-row">
        <div id="avatar-preview"></div>
        <div class="settings__avatar-acts">
          <input type="file" class="upload__input" id="avatar-file" accept="image/jpeg,image/png,image/webp">
          <button class="btn btn--ghost btn--sm" type="button" id="avatar-pick">上傳頭像</button>
          <button class="btn btn--quiet btn--sm" type="button" id="avatar-remove">移除頭像</button>
          <p class="hint">JPG / PNG / WEBP，單檔上限 5MB；沒有頭像時顯示名字首字。</p>
        </div>
      </div>
      <div class="field-err" id="e-avatar"></div>
    </section>

    <section class="settings__block">
      <h2>基本資料</h2>
      <div class="field" id="f-name">
        <label for="set-name">暱稱 <span class="req">*</span></label>
        <input class="input" type="text" id="set-name" maxlength="20" autocomplete="nickname" aria-describedby="e-name">
        <div class="field-err" id="e-name">請填寫 2 到 20 字</div>
      </div>
      <div class="field" id="f-phone">
        <label for="set-phone">電話 <span class="req">*</span></label>
        <input class="input" type="tel" id="set-phone" autocomplete="tel" placeholder="09xxxxxxxx" aria-describedby="e-phone">
        <div class="field-err" id="e-phone">請填寫有效的電話號碼（09 開頭，共 10 碼）</div>
        <p class="hint">電話是登入帳號；修改後下一次登入請使用新號碼。</p>
      </div>
      <div class="field" id="f-city">
        <label for="set-city">縣市 <span class="req">*</span></label>
        <select class="input" id="set-city" aria-describedby="e-city">
          <option value="">請選擇縣市</option>
        </select>
        <div class="field-err" id="e-city">請選擇縣市</div>
      </div>
      <div class="field" id="f-district">
        <label for="set-district">鄉鎮市區 <span class="opt-tag">選填</span></label>
        <input class="input" type="text" id="set-district" maxlength="20" autocomplete="address-level2" aria-describedby="e-district">
        <div class="field-err" id="e-district">最多 20 字</div>
      </div>
      <div class="field" id="f-address">
        <label for="set-address">詳細地址 <span class="opt-tag">選填</span></label>
        <input class="input" type="text" id="set-address" maxlength="100" autocomplete="street-address" aria-describedby="e-address">
        <div class="field-err" id="e-address">最多 100 字</div>
      </div>
    </section>

    <div class="settings__acts">
      <button class="btn btn--primary" type="submit" id="settings-save">儲存變更</button>
      <a class="btn btn--quiet" id="settings-profile" href="profile.html">查看個人資訊</a>
    </div>
  </form>
</main>
